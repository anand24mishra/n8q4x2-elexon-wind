services:
  api:
    build: ./backend
    environment:
      CACHE_FILE: /app/data/elexon-january-2026.json
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
    volumes:
      - windward_data:/app/data
    restart: unless-stopped
  web:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
volumes:
  windward_data:
